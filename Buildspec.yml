version: 0.2

phases:
  install:
    runtime-versions:
      java: openjdk11
    commands:
      # Installing Maven
      echo "Installing Maven"
      yum install -y maven

  pre_build:
    commands:
      echo "Pre-build phase started"
      mvn clean install -DskipTests

  build:
    commands:
      echo "Building WAR file"
      mvn clean package -DskipTests

  post_build:
    commands:
      echo "Post-build phase"
      echo "Build complete. WAR file ready for deployment!"

artifacts:
  files:
    - target/*.war
  discard-paths: yes

cache:
  paths:
    - '/root/.m2/**/*'
